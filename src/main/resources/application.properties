spring.application.name=Sistema_prestamos_equipos_Daysi_Alejandra

# Carga variables desde un archivo .env local (opcional, ignorado por Git).
# Tambien pueden definirse como variables de entorno del sistema o en la configuracion de IntelliJ.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8081}

# --- Base de datos PostgreSQL (la contrasena NO se escribe aqui: viene de DB_PASSWORD) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tecno_uam_prestamos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT (el secreto NO se escribe aqui: viene de JWT_SECRET, minimo 32 caracteres) ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- CORS: origen del frontend React (Vite) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Cuentas de prueba creadas al iniciar (ver README) ---
app.seed.admin-password=${APP_ADMIN_PASSWORD:Admin123*}
app.seed.user-password=${APP_USER_PASSWORD:Usuario123*}
app.seed.equipos-demo=${APP_SEED_EQUIPOS:true}
