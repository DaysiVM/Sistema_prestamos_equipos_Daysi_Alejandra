# Configuracion exclusiva de las pruebas automaticas: base H2 en memoria (no toca PostgreSQL).
spring.datasource.url=jdbc:h2:mem:prestamos_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Secreto de prueba (solo valido para los tests, no se usa en ejecucion real)
jwt.secret=secreto-solo-para-pruebas-automaticas-0123456789
jwt.expiration-ms=600000

app.cors.allowed-origins=http://localhost:5173
app.seed.admin-password=Admin123*
app.seed.user-password=Usuario123*
app.seed.equipos-demo=false
